<form id="frmAlumno">
    
    <div class="card border-secondary mb-3", style="min-width: 700px;">
        <div class="card-header">
            <div class="d-flex">
                Administracion de alumnos
                <div class="ms-auto">
                    <button data-form="alumno" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>
        
           
        </div>
        <div class="card-body text-secondary">
            <div class="row p-1">
                <div class="col-3 col-md-2">CODIGO</div>
                <div class="col-9 col-md-4">
                    <input required type="text" class="form-control" id="txtCodigoAlumno" name="txtCodigoAlumno" />
                </div>
            </div>

            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-8">
                    <input required type="text" class="form-control" id="txtNombreAlumno" name="txtNombreAlumno" />
                </div>
            </div>

            <div class="row p-1">
                <div class="col-3 col-md-2">DIRECCION</div>
                <div class="col-9 col-md-10">
                    <input required type="text" class="form-control" id="txtDireccionAlumno" name="txtDireccionAlumno" />
                </div>
            </div>

            <div class="row p-1">
                <div class="col-3 col-md-2">TELEFONO</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtTelefonoAlumno" name="txtTelefonoAlumno" />
                </div>
            </div>

            <div class="row p-1 text-center">
                <div class="col-12">
                    <input type="submit" class="btn btn-outline-primary" value="Guardar" />
                    <input type="reset" class="btn btn-outline-warning" value="Nuevo" />
                    <input type="button" class="btn btn-outline-success" value="Buscar" onclick="abrirVentana(`busqueda_alumno`)"/>
                </div>
            </div>
        </div>
    </div>
</form>

<script>
    // CUANDO SEA EL EVENTO DE GUARDADO O EL BOTON GUARDAR
    frmAlumno.addEventListener('submit', e => {
        e.preventDefault();
        guardarAlumno();
    });

    //Funcion async?
    async function guardarAlumno() {
        // declarar la variable para los datos a obtener
        let datos = {
            codigo: txtCodigoAlumno.value,
            nombre: txtNombreAlumno.value,
            direccion: txtDireccionAlumno.value,
            telefono: txtTelefonoAlumno.value
        },
            //LLamada post a la API
            url = `https://localhost:7099/api/alumnos`,
            method = `POST`
        const respuesta = await fetch(url, {
            method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        }), alumno = await respuesta.json(); //Nos dira si si o no se encio
        if ((alumno?.idAlumno || 0) > 0) { // ? -> No existe 
            limpiarDatosAlumno()
        }
    }

    function limpiarDatosAlumno() {
        txtCodigoAlumno.value = "";
        txtNombreAlumno.value = "";
        txtDireccionAlumno.value = "";
        txtTelefonoAlumno.value = "";
    }
</script>
